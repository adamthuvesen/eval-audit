[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API requires Argument()/Option() calls in defaults.
"eval_audit/cli.py" = ["B008", "TID251"]
# Owners of process and network calls. Tests drive git and the CLI directly.
"eval_audit/cli_templates.py" = ["TID251"]
"tools/fixture_io.py" = ["TID251"]
"scouting/humaneval-direct-completion/run.py" = ["TID251"]
"scouting/humaneval-direct-completion/grade.py" = ["TID251"]
".agents/skills/verify-eval-audit/verify" = ["TID251"]
"tests/**" = ["TID251"]

[tool.basedpyright]
include = ["."]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

# Lower layers must not import higher ones. Put new modules in the lowest layer that
# owns their concept; if a contract fails, move the shared code down, not the import up.
[tool.importlinter]
root_package = "eval_audit"

[[tool.importlinter.contracts]]
name = "A lower eval_audit layer must not import a higher one; move the shared code down a layer, not the import up"
type = "layers"
containers = ["eval_audit"]
layers = [
    "cli",
    "pipeline | portfolio",
    "checks | artifacts",
    "report",
    "stats",
    "evidence",
    "ingest | errors | scouting_paths | spec | fixtures | cli_templates",
    "evidence_types | schema",
]
exhaustive = true
