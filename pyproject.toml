[project]
name = "eval-audit"
version = "1.0.0"
description = "Turn agent benchmark claims into auditable model-selection decisions: declared studies, paired analysis, cost-aware reports."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "eval-audit contributors" }]
keywords = [
    "evaluation",
    "benchmarking",
    "audit",
    "statistics",
    "methodology",
    "reproducibility",
    "agent-evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "polars>=1.0",
    "scipy>=1.13",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/adamthuvesen/eval-audit"
Repository = "https://github.com/adamthuvesen/eval-audit"
Issues = "https://github.com/adamthuvesen/eval-audit/issues"
Changelog = "https://github.com/adamthuvesen/eval-audit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "basedpyright==1.40.2",
    "scipy-stubs>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff==0.17.4",
    # Used only by scouting/synthetic/generate.py; not a runtime dep of eval-audit.
    "pyarrow>=17.0",
    "import-linter>=2.15",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
eval-audit = "eval_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_audit"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.claude",
    "/.codex",
    "/.env",
    "/.env.local",
    "/.hypothesis",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.scout-cache",
    "/.venv",
    "/dist",
    "/worktrees",
]

# Ship the BYO template files inside the wheel so `eval-audit init` works
# under `uv tool install` / `pipx install`, where the source-checkout
# `examples/byo-minimal/` directory is not present. The runtime resolver in
# `eval_audit/cli_templates.py::template_dir` looks here first, then falls
# back to the source-checkout location for editable installs.
[tool.hatch.build.targets.wheel.force-include]
"examples/byo-minimal/study.yaml" = "eval_audit/_templates/byo-minimal/study.yaml"
"examples/byo-minimal/make_runs.py" = "eval_audit/_templates/byo-minimal/make_runs.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `verify` tests (wheel install, simulations) run only through `make slow`.
addopts = "-q -m 'not verify'"
strict_markers = true
markers = ["verify: slow suite, excluded by default; run with make slow"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003", "PGH004", "TID251"]
# RUF001-003: reports and docs use real math symbols (x, alpha, minus) on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

